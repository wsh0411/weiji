<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="theme-color" content="#8B1E24" />
<title>未济 · 个人成长工作台</title>
<link rel="stylesheet" href="assets/styles.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238B1E24'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle' fill='%23F4E3C1' font-family='serif'%3E䷿%3C/text%3E%3C/svg%3E" />
</head>
<body>
<!-- 顶部品牌栏 -->
<header class="app-header">
  <div class="brand">
    <span class="hexagram">䷿</span>
    <div class="brand-text">
      <h1>未济</h1>
      <p class="brand-sub">明道 · 集义 — 个人成长工作台</p>
    </div>
  </div>
  <div class="header-right">
    <div class="today-clock">
      <div class="tc-date" id="clockDate">—</div>
      <div class="tc-time" id="clockTime">—</div>
    </div>
    <button class="icon-btn" id="btnSettings" title="设置与数据">⚙</button>
  </div>
</header>

<!-- 主体内容 -->
<main class="app-main" id="appMain">
  <!-- 各视图由 JS 渲染 -->
  <section class="view" id="view-today"></section>
  <section class="view" id="view-mingdao" hidden></section>
  <section class="view" id="view-jiyi" hidden></section>
  <section class="view" id="view-data" hidden></section>
  <section class="view" id="view-plan" hidden></section>
</main>

<!-- 底部/侧边导航 -->
<nav class="app-nav" id="appNav">
  <button class="nav-btn active" data-view="today"><span class="ni">☯</span><span class="nt">今日</span></button>
  <button class="nav-btn" data-view="mingdao"><span class="ni">书</span><span class="nt">明道</span></button>
  <button class="nav-btn" data-view="jiyi"><span class="ni">义</span><span class="nt">集义</span></button>
  <button class="nav-btn" data-view="data"><span class="ni">📊</span><span class="nt">数据</span></button>
  <button class="nav-btn" data-view="plan"><span class="ni">历</span><span class="nt">计划</span></button>
</nav>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">未济</h3>
      <button class="icon-btn" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<!-- 全屏记录视图 -->
<div class="full-view" id="fullView" hidden>
  <div class="fv-head">
    <button class="fv-back" id="fvBack">‹ 返回</button>
    <h2 id="fvTitle">记录</h2>
  </div>
  <div class="fv-toolbar">
    <input type="search" id="fvSearch" class="fv-search" placeholder="🔍 搜索记录内容 / 日期…" />
    <input type="date" id="fvDate" class="fv-date" title="按日期筛选" />
    <button class="btn ghost sm" id="fvAll">全部日期</button>
  </div>
  <div class="fv-list" id="fvList"></div>
  <button class="fv-fab" id="fvNew" title="新建记录">＋</button>
  <div class="fv-editor" id="fvEditor" hidden>
    <input type="text" id="fvTitleInput" class="fv-title-input" placeholder="标题（选填）" maxlength="60" />
    <textarea id="fvInput" placeholder="写下你的记录…"></textarea>
    <div class="fv-edit-actions">
      <button class="btn ghost" id="fvCancel">取消</button>
      <button class="btn" id="fvSave">保存</button>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
